    <!--
      Static SEO tags. Social crawlers (Facebook / WhatsApp / Telegram) don't run
      JS, so these — not the per-route useSeo() hook — are what they read. Keep
      the copy in sync with src/config/site.ts. If the domain changes, grep the
      repo for "engineering-studio.net" and update every copy.
    -->
    <title>Solutions Globales en Ingénierie | Engineering Studio</title>
    <meta
      name="description"
      content="Solutions Globales en Ingénierie, Études Techniques d’Ingénierie du Bâtiment, MEP/CET, VRD, BIM, Topographie. Étude Clé en Main."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://engineering-studio.net/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Engineering Studio" />
    <meta property="og:title" content="Solutions Globales en Ingénierie | Engineering Studio" />

      property="og:description"
      content="Solutions Globales en Ingénierie, Études Techniques d’Ingénierie du Bâtiment, MEP/CET, VRD, BIM, Topographie. Étude Clé en Main."
    />
    <meta property="og:url" content="https://engineering-studio.net/" />
    <meta property="og:image" content="https://engineering-studio.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Solutions Globales en Ingénierie, Études Techniques d’Ingénierie du Bâtiment, MEP/CET, VRD, BIM, Topographie. Étude Clé en Main."
    />
    <meta name="twitter:image" content="https://engineering-studio.net/og-image.png" />

    <link rel="preconnect" href="https://mutcpgflaqyeibvuowfi.supabase.co" crossorigin />

    <script type="application/ld+json">

      }
